<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTG Documentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
        }

        h1 {
            color: white;
            font-size: 3rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.2rem;
            margin-bottom: 50px;
        }

        .cards {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 40px 30px;
            width: 250px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.3);
        }

        .card .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .card h2 {
            color: #1e3a5f;
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .card p {
            color: #64748b;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .card.manual {
            border-top: 4px solid #2563eb;
        }

        .card.assistant {
            border-top: 4px solid #10b981;
        }

        footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Beyond The Game</h1>
        <p class="subtitle">Documentation &amp; Help</p>

        <div class="cards">
            <a href="manual.html" class="card manual">
                <div class="icon">📖</div>
                <h2>User Manual</h2>
                <p>Complete documentation of all BTG features, step-by-step guides, and reference information.</p>
            </a>

            <a href="btg-assistant.html" class="card assistant">
                <div class="icon">🤖</div>
                <h2>AI Assistant</h2>
                <p>Ask questions about BTG and get instant answers powered by AI. Requires Gemini API key.</p>
            </a>
        </div>

        <footer>
            <p>Beyond The Game &copy; 2026</p>
        </footer>
    </div>
</body>
</html>
